name: Release

# This follows the same release-PR loop as Tasty: ordinary changes carry small changeset files;
# pushes to main update one version PR; merging that PR publishes and creates package tags.
# A manual run is always a rehearsal and can never publish.
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS because the test suite exercises the Vision/PDFKit extractor and the FSEvents
    # watcher. A package published from a machine that could not run its own tests is a guess.
    runs-on: macos-latest
    permissions:
      actions: write # dispatch CI for the generated release PR
      contents: write # version commits, package tags, and GitHub releases
      pull-requests: write # the rolling Changesets release PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # package.json is the single pnpm-version authority. Supplying another version here makes
      # action-setup reject the job before installation when the two declarations differ.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: No committed local config or secrets
        run: pnpm check:repository

      # Publishing repeats the whole CI gate. The release PR can be reviewed like any other PR,
      # but the merge commit is the immutable source of the package bytes.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke-demo.mjs

      # What a tarball contains is not covered by the build or the tests, and it is the one
      # thing that cannot be fixed after the fact — a published version number is spent.
      - name: Tarballs carry what the runtime needs
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for pkg in protocol core client cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$out" >/dev/null)
          done
          for tgz in "$out"/*.tgz; do
            name=$(basename "$tgz")
            for required in package/LICENSE package/README.md; do
              tar tzf "$tgz" | grep -qx "$required" || { echo "::error::$name has no $required"; exit 1; }
            done
            # workspace:* and catalog: must be gone. pnpm rewrites them; npm does not, and a
            # tarball with either in it installs from the registry and fails.
            if tar xzOf "$tgz" package/package.json | grep -qE '"(workspace|catalog):'; then
              echo "::error::$name still has an unresolved workspace or catalog specifier"
              exit 1
            fi
          done
          # The installed core reads its committed defaults from beside dist. Without this file
          # every command throws `committed defaults are missing`.
          tar tzf "$out"/tenphi-akno-core-*.tgz | grep -qx 'package/config/default.jsonc' \
            || { echo "::error::akno-core has no config/default.jsonc — see scripts/pack-assets.mjs"; exit 1; }
          tar tzf "$out"/tenphi-akno-core-*.tgz | grep -qx 'package/swift/extract.swift' \
            || { echo "::error::akno-core has no swift/extract.swift — PDF and OCR would be dead"; exit 1; }
          echo "all four tarballs verified"
          node scripts/smoke-packages.mjs "$out"

      - name: Open release PR or publish
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v2.1.1
        with:
          publish-script: pnpm release
          version-script: pnpm version:packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: release packages'
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # A PR created with GITHUB_TOKEN does not emit another pull_request event. Dispatching CI
      # explicitly keeps the generated version diff reviewable without requiring a personal token.
      - name: Validate generated release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"

      - name: Rehearsal complete
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Release gates passed; manual runs do not version, tag, or publish.'
