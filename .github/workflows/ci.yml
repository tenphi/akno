name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # package.json is the single pnpm-version authority. Supplying another version here makes
      # action-setup reject the job before installation when the two declarations differ.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No local config or credentials may reach the repo. `default.jsonc` must
      # stay machine-independent, and `local.jsonc` must never be tracked.
      - name: No committed local config or secrets
        run: |
          if git ls-files --error-unmatch config/local.jsonc >/dev/null 2>&1; then
            echo "::error::config/local.jsonc is tracked — it must stay gitignored"
            exit 1
          fi
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::a .env file is tracked"
            exit 1
          fi
          if grep -nE '"api_key"[[:space:]]*:[[:space:]]*"' config/default.jsonc config/local.example.jsonc; then
            echo "::error::an inline api_key literal in committed config — use { \"env\": \"NAME\" }"
            exit 1
          fi
          if grep -nE '/(Users|home)/[a-zA-Z]' config/default.jsonc; then
            echo "::error::a home path in committed defaults — default.jsonc must be machine-independent"
            exit 1
          fi
          # Akno is developed against a real knowledge base, so the fastest way to
          # write a regression test is to paste in the page that failed. See the
          # rule in AGENTS.md. This catches the shape of the mistake, not every
          # instance of it — a personal grep list belongs outside the repo.
          if git grep -nEi 'passport (number|no)[: ]|iban[: ]|\+[0-9]{10,}|[0-9]{4} ?[0-9]{4} ?[0-9]{4} ?[0-9]{4}' -- ':!*.lock' ':!pnpm-lock.yaml'; then
            echo "::error::what looks like real personal data in a tracked file — see AGENTS.md"
            exit 1
          fi

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test

      # The read path must work with no models configured — the integration suite
      # covers that, and it is the property that keeps CI free of an LLM.
      - name: Smoke — index and query a generated knowledge base
        run: node scripts/smoke.mjs

      # The shipped example is documentation that runs. Nothing else in this job would
      # notice an event line in a format the indexer does not match, or a link out of
      # the folder that indexes as a broken link inside it. Both have happened.
      - name: Smoke — the example knowledge base still works
        run: node scripts/smoke-demo.mjs
