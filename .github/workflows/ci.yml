name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # package.json is the single pnpm-version authority. Supplying another version here makes
      # action-setup reject the job before installation when the two declarations differ.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Content-safe output: a suspected private value is never copied into public CI logs.
      - name: No committed local config or secrets
        run: pnpm check:repository

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test

      # The read path must work with no models configured — the integration suite
      # covers that, and it is the property that keeps CI free of an LLM.
      - name: Smoke — index and query a generated knowledge base
        run: node scripts/smoke.mjs

      # The shipped example is documentation that runs. Nothing else in this job would
      # notice an event line in a format the indexer does not match, or a link out of
      # the folder that indexes as a broken link inside it. Both have happened.
      - name: Smoke — the example knowledge base still works
        run: node scripts/smoke-demo.mjs

  linux-document-extraction:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install native document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils tesseract-ocr
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm build
      - run: pnpm test
      - run: pnpm smoke
      - name: Smoke installed packages on Linux
        run: node scripts/smoke-packages.mjs

  generated-release-status:
    # GitHub runs a dispatched workflow against the release PR's commit but does not include
    # that check-run in the PR rollup. A commit status makes the same result visible on the PR.
    if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'changeset-release/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report generated release status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ needs.build.result }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='CI / generated release' \
            -f description="Generated release validation: $state" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
