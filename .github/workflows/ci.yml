name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # package.json is the single pnpm-version authority. Supplying another version here makes
      # action-setup reject the job before installation when the two declarations differ.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Content-safe output: a suspected private value is never copied into public CI logs.
      - name: No committed local config or secrets
        run: pnpm check:repository

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test

      # The read path must work with no models configured — the integration suite
      # covers that, and it is the property that keeps CI free of an LLM.
      - name: Smoke — index and query a generated knowledge base
        run: node scripts/smoke.mjs

      # The shipped example is documentation that runs. Nothing else in this job would
      # notice an event line in a format the indexer does not match, or a link out of
      # the folder that indexes as a broken link inside it. Both have happened.
      - name: Smoke — the example knowledge base still works
        run: node scripts/smoke-demo.mjs
