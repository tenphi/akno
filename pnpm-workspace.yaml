packages:
  - packages/*

# Do not resolve a dependency version published less than three days ago.
# A compromised release is usually yanked well inside that window.
minimumReleaseAge: 4320

# First-party @tenphi packages are published from repositories we control, so
# the yank window that motivates minimumReleaseAge does not apply to them.
minimumReleaseAgeExclude:
  - '@tenphi/*'
  # Cookbook 0.15 requires this renderer baseline.
  - '@astrojs/starlight@0.42.1'

# One declared version per shared dependency. Three packages depend on zod, and a
# monorepo where two of them resolve different majors produces schemas that look
# interchangeable and are not.
catalog:
  zod: ^4.4.3

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
